# ==============================================================================
# Render Blueprint - PayTrack Backend (NestJS + Prisma)
# https://render.com/docs/blueprint-spec
# ==============================================================================
#
# Para usar este blueprint:
# 1. Acesse https://dashboard.render.com/blueprints
# 2. Clique em "New Blueprint Instance"
# 3. Conecte o repositório GitHub
# 4. Configure as variáveis de ambiente quando solicitado
#
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # AI Query Engine - FastAPI (Python)
  # ----------------------------------------------------------------------------
  - type: web
    name: paytrack-ai-query-engine
    runtime: docker
    rootDir: ai-query-engine
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter

    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production

      - key: LOG_LEVEL
        value: INFO

      - key: POSTGRES_HOST
        sync: false

      - key: POSTGRES_PORT
        value: 5432

      - key: POSTGRES_DB
        sync: false

      - key: POSTGRES_USER
        sync: false

      - key: POSTGRES_PASSWORD
        sync: false

      - key: LLM_PROVIDER
        value: gemini

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      - key: OPENROUTER_API_KEY
        sync: false

      - key: OPENROUTER_MODEL
        value: qwen/qwen3-8b:free

      - key: QUERY_LIMIT
        value: 100

      - key: QUERY_TIMEOUT_SECONDS
        value: 10

      - key: AI_ENGINE_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # Backend API - PayTrack (NestJS)
  # ----------------------------------------------------------------------------
  - type: web
    name: paytrack-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: oregon # Região mais próxima do Neon (sa-east-1)
    plan: starter # Plano para produção

    # Health Check
    healthCheckPath: /api/health

    # Variáveis de ambiente
    envVars:
      # Porta (Render define automaticamente)
      - key: PORT
        value: 3000

      # Ambiente de execução
      - key: NODE_ENV
        value: production

      # URL do frontend para CORS (Vercel)
      # IMPORTANTE: Atualize com a URL real do frontend em produção
      - key: FRONTEND_URL
        value: https://paytrack-five.vercel.app

      # CORS Origins - Lista de origens permitidas separadas por vírgula
      - key: CORS_ORIGINS
        value: https://paytrack-five.vercel.app,https://paytrack-six.vercel.app,http://localhost:5173,http://localhost:3000

      # URL pública do AI Query Engine (serviço independente)
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: paytrack-ai-query-engine
          property: hostport

      # Chave compartilhada para autenticação entre backend e AI Engine
      - key: AI_SERVICE_API_KEY
        sync: false

      # Timeout de chamada para o AI Engine (ms)
      - key: AI_SERVICE_TIMEOUT_MS
        value: 15000

      # URL pública da própria API (usada pelo better-auth para montar redirect_uri)
      # IMPORTANTE: Atualize com a URL real do backend no Render
      - key: API_URL
        value: https://paytrack-backend.onrender.com

      # Google OAuth - Login social via better-auth
      # IMPORTANTE: Configure estes valores manualmente no dashboard do Render
      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Chave de assinatura das sessões do better-auth
      # Gere com: openssl rand -base64 32
      - key: BETTER_AUTH_SECRET
        sync: false

      # JWT Configuration
      # IMPORTANTE: Gere chaves seguras de 256 bits para produção
      # Exemplo: openssl rand -base64 32
      - key: JWT_SECRET
        sync: false # Não sincronizar - configurar manualmente

      - key: JWT_REFRESH_SECRET
        sync: false # Não sincronizar - configurar manualmente

      - key: JWT_EXPIRES_IN
        value: 7d

      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # Conexão com banco de dados (Neon PostgreSQL)
      # IMPORTANTE: Configure este valor manualmente no dashboard do Render
      # para não expor credenciais no repositório
      - key: DATABASE_URL
        sync: false # Não sincronizar - configurar manualmente

      # Conexão direta com banco (Neon - sem pooler)
      # IMPORTANTE: Para migrações, use a URL direta do Neon (sem -pooler)
      # Exemplo: postgresql://user:pass@host/database?sslmode=require
      # Isso evita problemas de lock com o pooler durante migrações
      - key: DIRECT_DATABASE_URL
        sync: false # Não sincronizar - configurar manualmente

      # IMPORTANTE: Sobre Migrações do Prisma
      # As migrações são executadas MANUALMENTE pelo usuário antes do deploy
      # Para aplicar novas migrações:
      # 1. Crie migração localmente: npx prisma migrate dev --name nome_da_migracao
      # 2. Aplique localmente: npx prisma migrate dev
      # 3. Faça commit e push das mudanças
      # 4. Execute manualmente no banco de produção: npx prisma migrate deploy
      #
      # Seed não é executado em produção

  # ----------------------------------------------------------------------------
  # BFF Mobile - PayTrack (NestJS)
  # ----------------------------------------------------------------------------
  - type: web
    name: paytrack-bff-mobile
    runtime: docker
    dockerfilePath: ./bff-mobile/Dockerfile
    region: oregon
    plan: starter

    # Health Check
    healthCheckPath: /bff/health

    # Variáveis de ambiente
    envVars:
      # Porta (Render define automaticamente)
      - key: PORT
        value: 3001

      # Ambiente de execução
      - key: NODE_ENV
        value: production

      # URL do backend principal (Render)
      # IMPORTANTE: Atualize com a URL real do backend em produção
      - key: BACKEND_URL
        value: https://paytrack-backend.onrender.com

      # JWT Secret — deve ser o MESMO valor que JWT_SECRET do backend.
      # O BFF valida tokens emitidos pelo backend (shared secret).
      - key: JWT_SECRET
        sync: false # Não sincronizar - configurar manualmente

      # CORS Origins - origens permitidas separadas por vírgula
      # Para apps mobile (Expo Go / builds), geralmente pode ficar vazio
      # (requisições de apps nativos não enviam Origin)
      - key: CORS_ORIGINS
        value: ''
